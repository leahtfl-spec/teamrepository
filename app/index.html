<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Inner Board</title>
  <meta name="description" content="The Inner Board command center: today's work, tasks, content, numbers, team and playbooks.">
  <meta name="theme-color" content="#F7F5F1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232E4A3D'/%3E%3Ctext x='16' y='22.5' text-anchor='middle' font-family='Georgia,serif' font-size='19' fill='%23F7F5F1'%3EI%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./main.js"></script>
</head>
<body>
  <div class="app" id="app">
    <aside class="rail" aria-label="Main">
      <a class="brand" href="#/today" aria-label="Inner Board, go to Today">
        <span class="wordmark" data-brand-name>Inner Board</span>
        <span class="tagline" data-brand-tagline>The practice of becoming you.</span>
      </a>
      <nav class="nav" id="nav"></nav>
      <div class="rail-foot">
        <div class="sync" id="sync" aria-live="polite"></div>
        <div class="me-slot" data-me-slot="rail"></div>
      </div>
    </aside>

    <header class="topbar">
      <a class="brand brand-sm" href="#/today" aria-label="Inner Board, go to Today">
        <span class="wordmark" data-brand-name>Inner Board</span>
      </a>
      <div class="me-slot" data-me-slot="top"></div>
    </header>

    <main class="main" id="main" tabindex="-1">
      <div class="preview-pill" id="preview" hidden>
        <span class="dot"></span>Preview — changes saved on this device only
      </div>
      <div class="view" id="view" aria-live="off">
        <div class="loading" role="status"><span class="spinner"></span>Opening the command center…</div>
      </div>
    </main>

    <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div id="layer"></div>
  <noscript><p style="padding:24px;font-family:system-ui">The Inner Board command center needs JavaScript turned on.</p></noscript>
</body>
</html>
